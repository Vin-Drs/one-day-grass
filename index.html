let audioCtx = null, soundOn = false, masterGain = null;
let windGain = null, gustTimer = null, birdTimer = null, cricketTimer = null;
const waves = document.getElementById('waves');
const muteLine = document.getElementById('muteLine');

// ★ 真实音频素材
const AUDIO_ASSETS = {
  frog_1: null, frog_2: null, frog_3: null, frog_4: null, frog_5: null,
  symphony: null
};
let useRealAudio = false;
let realAudioLoading = false;

async function loadRealAudio() {
  if (realAudioLoading || !audioCtx) return;
  realAudioLoading = true;
  const files = ['frog_1', 'frog_2', 'frog_3', 'frog_4', 'frog_5', 'symphony'];
  for (const name of files) {
    try {
      const res = await fetch('sounds/' + name + '.mp3');
      const buf = await res.arrayBuffer();
      AUDIO_ASSETS[name] = await audioCtx.decodeAudioData(buf);
      console.log('🎧 已加载 sounds/' + name + '.mp3');
    } catch (e) {
      console.warn('⚠️ 加载失败 sounds/' + name + '.mp3', e);
    }
  }
  if (AUDIO_ASSETS.frog_1 && AUDIO_ASSETS.symphony) {
    useRealAudio = true;
    console.log('🎧 真实音频已启用');
  } else {
    console.log('⚠️ 部分素材缺失，继续用代码合成');
  }
  realAudioLoading = false;
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  const bufSize = audioCtx.sampleRate * 3;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufSize; i++) {
    const w = Math.random() * 2 - 1;
    d[i] = (last + 0.012 * w) / 1.012;
    last = d[i]; d[i] *= 2.4;
  }
  const wind = audioCtx.createBufferSource();
  wind.buffer = buf; wind.loop = true;
  const wf = audioCtx.createBiquadFilter();
  wf.type = 'lowpass';
  wf.frequency.value = currentScene ? currentScene.windFreq : 420;
  wf.Q.value = 0.5;
  windGain = audioCtx.createGain();
  windGain.gain.value = currentScene ? currentScene.windGain * 3.2 : 0.32;
  wind.connect(wf); wf.connect(windGain); windGain.connect(masterGain);
  wind.start();
}
function playGust(durationSec) {
  if (!audioCtx || !currentScene) return;
  const now = audioCtx.currentTime;
  windGain.gain.cancelScheduledValues(now);
  windGain.gain.setValueAtTime(windGain.gain.value, now);
  windGain.gain.linearRampToValueAtTime(currentScene.gustPeak * 3.2, now + 1.2);
  windGain.gain.linearRampToValueAtTime(currentScene.windGain * 3.2, now + durationSec);
}
function scheduleGust() {
  const delay = 15000 + Math.random() * 12000;
  gustTimer = setTimeout(() => {
    triggerGust(4 + Math.random() * 3);
    if (soundOn && audioCtx) playGust(4 + Math.random() * 3);
    scheduleGust();
  }, delay);
}
function playRustle(intensity, isLong) {
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = isLong ? 0.55 + Math.random() * 0.25 : 0.25 + Math.random() * 0.12;
  const bufSize = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    const t = i / bufSize;
    let env;
    if (t < 0.2) env = t / 0.2;
    else env = Math.pow(1 - (t - 0.2) / 0.8, 1.6);
    d[i] = (Math.random() * 2 - 1) * env;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1600 + Math.random() * 400;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 250;
  const g = audioCtx.createGain();
  const vol = Math.min(0.28, 0.048 + intensity * 0.022);
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start(now); src.stop(now + dur + 0.05);
}
function playBird() {
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const notes = 2 + Math.floor(Math.random() * 3);
  const baseFreq = 1600 + Math.random() * 1400;
  for (let i = 0; i < notes; i++) {
    const t = now + i * (0.12 + Math.random() * 0.10);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    const f1 = baseFreq * (0.9 + Math.random() * 0.3);
    const f2 = f1 * (1.1 + Math.random() * 0.2);
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + 0.06);
    osc.frequency.exponentialRampToValueAtTime(f1 * 0.95, t + 0.14);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16 + Math.random() * 0.10, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + 0.20);
  }
}
function playRandomBird() {
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  if (currentScene && currentScene.name === '夜间') {
    const notes = 2;
    const baseFreq = 480 + Math.random() * 130;
    for (let i = 0; i < notes; i++) {
      const t = now + i * 0.5;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, t);
      osc.frequency.linearRampToValueAtTime(baseFreq * 1.05, t + 0.25);
      osc.frequency.linearRampToValueAtTime(baseFreq * 0.9, t + 0.4);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + 0.44);
    }
  } else {
    playBird();
  }
}
function scheduleBird() {
  if (!soundOn || !currentScene) return;
  const delay = currentScene.birdDelayMin + Math.random() * currentScene.birdDelayRange;
  birdTimer = setTimeout(() => {
    if (!soundOn) return;
    playRandomBird();
    scheduleBird();
  }, delay);
}
function playCricketByType(type, volumeMul) {
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  volumeMul = volumeMul || 1;
  if (type === 0) {
    const pulses = 3 + Math.floor(Math.random() * 3);
    const freq = 4200 + Math.random() * 800;
    for (let i = 0; i < pulses; i++) {
      const t = now + i * 0.09;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 12;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07 * volumeMul, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      osc.connect(bp); bp.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + 0.09);
    }
  } else if (type === 1) {
    const pulses = 4 + Math.floor(Math.random() * 3);
    const baseFreq = 2800 + Math.random() * 600;
    for (let i = 0; i < pulses; i++) {
      const t = now + i * 0.10;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(baseFreq, t);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, t + 0.07);
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = baseFreq; bp.Q.value = 8;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.082 * volumeMul, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(bp); bp.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + 0.10);
    }
  } else {
    const pulses = 5 + Math.floor(Math.random() * 3);
    const freq = 5600 + Math.random() * 900;
    for (let i = 0; i < pulses; i++) {
      const t = now + i * 0.06;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 18;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.055 * volumeMul, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      osc.connect(bp); bp.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + 0.06);
    }
  }
}
function playRandomCricket(volumeMul) {
  playCricketByType(Math.floor(Math.random() * 3), volumeMul);
}
function scheduleCricket() {
  if (!soundOn || !currentScene) return;
  const delay = currentScene.cricketDelayMin + Math.random() * currentScene.cricketDelayRange;
  cricketTimer = setTimeout(() => {
    if (!soundOn) return;
    playRandomCricket(1);
    if (Math.random() < 0.5) setTimeout(() => playRandomCricket(0.7), 250 + Math.random() * 300);
    scheduleCricket();
  }, delay);
}
function startAmbient() {
  scheduleGust();
  scheduleBird();
  scheduleCricket();
}
function stopAmbient() {
  if (birdTimer) { clearTimeout(birdTimer); birdTimer = null; }
  if (cricketTimer) { clearTimeout(cricketTimer); cricketTimer = null; }
  endGust();
  if (windGain && audioCtx && currentScene) {
    windGain.gain.cancelScheduledValues(audioCtx.currentTime);
    windGain.gain.setValueAtTime(currentScene.windGain * 3.2, audioCtx.currentTime);
  }
}
speaker.addEventListener('click', function (e) {
  e.stopPropagation();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // ★ 第一次打开声音时，异步加载真实音频素材
  loadRealAudio();
  if (!soundOn) {
    soundOn = true;
    masterGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.8);
    speaker.classList.add('on');
    waves.setAttribute('opacity', '1');
    muteLine.setAttribute('opacity', '0');
    scheduleBird();
    scheduleCricket();
  } else {
    soundOn = false;
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    speaker.classList.remove('on');
    waves.setAttribute('opacity', '0');
    muteLine.setAttribute('opacity', '1');
    stopAmbient();
  }
});
speaker.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

// ======================================================
// 12. 三色 LED 状态机 + 场景切换按钮
// ======================================================
function updateScenePanelActive(idx) {
  const btns = document.querySelectorAll('.sceneBtn');
  btns.forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.tl, 10) === idx);
  });
}

let ghostTimer = null;

function applyUIMode() {
  ledBtn.className = 'mode-' + uiMode;
  if (ghostTimer) { clearTimeout(ghostTimer); ghostTimer = null; }
  
  document.body.classList.remove('mode-sound', 'mode-immersive');
  
  if (uiMode === 0) {
    hintText.classList.remove('hidden');
    speaker.style.display = '';
    fullBtn.style.display = '';
    ledBtn.classList.remove('ghost');
    sceneInfo.style.opacity = '';
    document.body.classList.remove('mode-sound', 'mode-immersive');
    updateSceneInfoText();
  } else if (uiMode === 1) {
    hintText.classList.add('hidden');
    speaker.style.display = '';
    fullBtn.style.display = 'none';
    ledBtn.classList.remove('ghost');
    sceneInfo.style.opacity = '';
    document.body.classList.add('mode-sound');
    updateSceneInfoText();
  } else if (uiMode === 2) {
    hintText.classList.add('hidden');
    speaker.style.display = 'none';
    fullBtn.style.display = 'none';
    ledBtn.classList.remove('ghost');
    sceneInfo.style.opacity = '0';
    document.body.classList.add('mode-immersive');
    ghostTimer = setTimeout(function () {
      ledBtn.classList.add('ghost');
    }, 1000);
  }
  
  if (uiMode === 1 && !soundOn) {
    if (speaker) speaker.click();
  }
}

function startClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(function () {
    if (uiMode === 0 || uiMode === 1) updateSceneInfoText();
  }, 1000);
}

ledBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  uiMode = (uiMode + 1) % 3;
  applyUIMode();
});
ledBtn.addEventListener('touchstart', function (e) {
  e.stopPropagation();
}, { passive: true });

function jumpToTimeline(idx) {
  if (idx < 0 || idx >= TIMELINE.length) return;
  if (isTransitioning) return;
  if (rewardActive) return;
  startBlackTransition(idx);
}

document.querySelectorAll('.sceneBtn').forEach(btn => {
  const handler = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const idx = parseInt(btn.dataset.tl, 10);
    jumpToTimeline(idx);
  };
  btn.addEventListener('click', handler);
  btn.addEventListener('touchstart', handler, { passive: false });
});

// ======================================================
// 13. 主循环 / 场景检查 / 17:42 钟声
// ======================================================
function checkTimeScene() {
  if (isTransitioning) return;
  if (rewardActive) return;
  if (farewellPetalsActive) return;
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  const desired = findTimelineIdx(h);
  if (desired !== currentTimelineIdx) {
    startBlackTransition(desired);
  }
}

function check1742Bell() {
  if (!soundOn) return;
  if (isTransitioning) return;
  if (rewardActive) return;
  const now = new Date();
  const hh = now.getHours();
  const mm = now.getMinutes();
  const slot = hh * 60 + mm;
  if (hh === 17 && mm === 42) {
    if (bell1742LastTriggered !== slot) {
      bell1742LastTriggered = slot;
      console.log('🔔 17:42 钟声自动响起');
      synthBellSequence();
      const desired = findTimelineIdx(17.7);
      if (desired !== currentTimelineIdx) {
        startBlackTransition(desired);
      }
    }
  }
}

function mainLoop(now) {
  const dt = Math.min(50, now - lastTickTime) / 1000;
  lastTickTime = now;
  if (isTransitioning) {
    updateBlackTransition(dt);
  }
  requestAnimationFrame(mainLoop);
}

// ======================================================
// 14. 初始化
// ======================================================
function resizeAll() {
  W = window.innerWidth;
  H = window.innerHeight;
  COLS = Math.ceil(W / PIXEL);
  ROWS = Math.ceil(H / PIXEL);

  [bgCanvas, grassCanvas, waveCanvas, starCanvas, flowerCanvas, fxCanvas].forEach(c => {
    c.width = COLS; c.height = ROWS;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  transitionCanvas.width = COLS; transitionCanvas.height = ROWS;
  transitionCanvas.style.width = W + 'px'; transitionCanvas.style.height = H + 'px';
  transCtx.clearRect(0, 0, COLS, ROWS);

  farewellCanvas.width = COLS; farewellCanvas.height = ROWS;
  farewellCanvas.style.width = W + 'px'; farewellCanvas.style.height = H + 'px';
  farewellCtx.clearRect(0, 0, COLS, ROWS);

  signCanvas.width = W; signCanvas.height = H;
  signCanvas.style.width = W + 'px'; signCanvas.style.height = H + 'px';
  signCtx.clearRect(0, 0, W, H);

  preGenerate();
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  const tlIdx = findTimelineIdx(h);
  currentTimelineIdx = tlIdx;
  currentScene = SCENES[TIMELINE[tlIdx].idx];
  renderScene(currentScene);
  updateScenePanelActive(tlIdx);
  checkOrientation();
  updateSceneInfoText();
  startClock();
  renderDebugDots();
}

window.addEventListener('resize', () => {
  clearTimeout(window._rt);
  window._rt = setTimeout(resizeAll, 250);
});

resizeAll();
setInterval(checkTimeScene, 30000);
setInterval(check1742Bell, 15000);
requestAnimationFrame(mainLoop);
requestAnimationFrame(renderGust);
renderFx();
requestAnimationFrame(renderFarewellPetals);
lastTickTime = performance.now();

scheduleGust();

// ★ 页面打开就立刻预加载音频素材（但需要用户点一下才能播放）
// 浏览器策略限制：必须用户交互后才能 resume audioCtx，所以这里只 try initAudio
setTimeout(function () {
  try {
    initAudio();
    loadRealAudio();
  } catch (e) {
    // 静默失败，等用户点开声音按钮再加载
  }
}, 800);

applyUIMode();
</script>

  }

</script>

    console.log('主脚本执行成功');
